schema_version: "1.1"
name: gap-marked-not-filled
description: "환불 규칙이 빠진 기획서에서 빈 곳을 채우지 않고 `확인 필요`로 남기며 템플릿 구조를 따르는지"
tags: [gap, template]
execution:
  prompt: |
    /analyzing-requirements docs/plan/order-cancel.md

    질문하면 이렇게 답한다: 환불 금액, 환불 수단, 환불 시점, 쿠폰·포인트 처리는 기획팀도 아직 안 정했다. 그 밖의 질문에는 "기획서에 있는 것 외에는 모른다"로 답한다. 저장 경로는 docs/requirements/order-cancel.md.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:88
  - name: saved-with-gap-list
    type: regex
    target: {source: file, path: docs/requirements/order-cancel.md}
    pattern: '##\s*확인 필요'
    match: contains
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:19
  - name: gap-marked
    type: llm
    criteria: |
      PASS: docs/requirements/order-cancel.md에서 환불 요구사항 자리에 `확인 필요` 표시가 있고, 문서 끝 "확인 필요" 목록에 환불(금액, 수단, 시점, 쿠폰·포인트 중 정해지지 않은 것)이 항목으로 있다.
      FAIL: 환불 요구사항 자리에 `확인 필요`가 없거나, 끝의 "확인 필요" 목록에 환불 항목이 없다.
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:13, skills/in-progress/analyzing-requirements/SKILL.md:17
  - name: nothing-invented
    type: llm
    criteria: |
      PASS: 문서의 모든 항목이 기획서나 위 답변에 근거가 있다. 환불 방식(전액 환불, 원결제 수단 환불, n영업일 이내 등), 쿠폰·포인트 처리, 알림톡 문구, 버튼 위치·문구, API 경로·응답 형식처럼 기획서에 없는 내용을 확정된 요구사항으로 적지 않는다.
      FAIL: 기획서와 답변에 없는 규칙이나 세부를 요구사항, 개발 범위, 섹션 내용에 적는다.
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:56-80
  - name: template-structure
    type: llm
    criteria: |
      PASS: 문서가 `# <기획서 제목> 요구사항`, `## 개발 범위`(`서비스 | 개발 영역 | 내용` 표, 쇼핑몰 웹과 주문 서버 API를 나눈 행), `## 요구사항` 순으로 시작하고, 그 뒤 섹션은 기획서에 있는 것(배경, 기능 목록, 일정)만 기획서 순서대로 있으며, 화면 목록·as-is·to-be처럼 기획서에 없는 섹션이 없고, 끝에 `## 확인 필요`가 있다.
      FAIL: 개발 범위나 요구사항 섹션이 없거나, 개발 범위가 서비스·개발 영역으로 나뉘지 않거나, 기획서에 없는 섹션이 있거나, 섹션 순서가 기획서와 다르다.
