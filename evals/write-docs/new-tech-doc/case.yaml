schema_version: "1.1"
name: new-tech-doc
description: 일부가 빠진 메모로 기술 문서 새 초안을 쓸 때 빠진 값을 지어내지 않고 [확인 필요] 표시나 질문으로 남기는지
tags: [new-draft, tech]
execution:
  prompt: |
    /write-docs notes/retry-memo.md 메모로 결제 SDK 재시도 옵션 문서 초안 써줘.
    - 분야: 기술 문서, 유형은 참조
    - 독자: SDK를 처음 붙이는 사내 백엔드 개발자
    - 목적: 옵션 표를 보고 바로 재시도를 설정하게 한다
    - 톤: 합니다체
    - 자료: 메모 파일이 전부야
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/productivity/write-docs/SKILL.md:47
  # 근거: skills/productivity/write-docs/SKILL.md:50
  - name: no-invented-values
    type: llm
    criteria: |
      PASS: 메모에 없는 값(base_delay 기본값, timeout 기본값, retry_on에서 503 말고 기본 포함되는 코드)을 숫자나 목록으로 채우지 않는다. 초안을 냈다면 그 자리에 `[확인 필요: ...]`처럼 무엇이 빠졌는지 보이는 표시를 남기고, 초안 대신 이 값들을 물었다면 PASS다.
      FAIL: 메모에 없는 기본값이나 상태 코드를 그럴듯하게 적거나, "환경에 따라 다를 수 있다" 같은 모호한 문장으로 빈 곳을 덮는다.
  # 근거: skills/productivity/write-docs/SKILL.md:66
  - name: marker-list
    type: llm
    criteria: |
      PASS: 초안에 `[확인 필요]` 표시가 있으면 결과 아래에 그 목록을 한 줄씩 적는다. 표시가 없거나 초안 대신 질문했다면 PASS다.
      FAIL: 초안에 `[확인 필요]` 표시가 있는데 결과 아래에 목록이 없다.
  # 근거: skills/productivity/write-docs/SKILL.md:50
  - name: question-is-last
    type: llm
    criteria: |
      PASS: 자료에 없는 사실을 사용자에게 물었다면 그 질문이 이 턴의 마지막 메시지이고, 질문 뒤에 도구 호출이나 초안 작성을 이어 가지 않는다. 묻지 않고 `[확인 필요]` 표시로 남겼다면 PASS다.
      FAIL: 질문을 보낸 뒤 같은 턴에서 도구를 호출하거나 초안을 계속 쓰거나, 질문을 도구 호출 사이 메시지에 끼워 넣는다.
