schema_version: "1.1"
name: report-new-draft
description: 개조식 실험 메모로 팀 슬랙 보고를 새로 쓸 때, 고칠 곳을 알려 주지 않아도 결론을 먼저 쓰고 행동을 숨긴 문장·지어낸 말·빈 문장 없이 쓰며 사실을 지키는지
tags: [new-draft, work-message]
execution:
  # 메모는 명사로 끝나는 개조식이라 그대로 옮기면 행동이 명사에 숨는다. 프롬프트는 고칠 곳을 알려 주지 않는다.
  prompt: |
    /write-docs notes/exp-memo.md 메모로 팀 슬랙 #growth 채널에 올릴 실험 결과 보고 써줘.
    - 분야: 업무 메시지
    - 독자: 그로스팀과 데이터팀
    - 목적: 실험 결과와 다음 할 일을 알린다
    - 톤: 해요체
    - 자료: 메모 파일이 전부야
    결과는 채팅으로 보여 줘.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/productivity/write-docs/SKILL.md:55
  # 근거: skills/productivity/write-docs/SKILL.md:84
  # 근거: skills/productivity/write-docs/reference/clear-writing.md:25
  - name: unclear-sentence-ratio
    type: llm
    criteria: |
      결과의 슬랙 보고 본문(본문 밖의 확인 요청·설명은 빼고)을 문장 단위로 나눈다. 목록 항목도 한 문장으로 센다. 단, "클릭률: B 4.1% / A 3.2%"처럼 지표 이름과 수치만 있는 항목은 세지 않는다.
      각 문장에 다음 결함이 있는지 붙인다.
      (1) 행동 숨김: 행동이 "적용 보류", "검토 요청 필요", "개선 확인", "~이 이루어졌다", "~ 진행"처럼 동사에서 나온 명사로 나와 누가 무엇을 하는지(또는 했는지) 문장에서 알 수 없다.
      (2) 모호하거나 지어낸 말: 명사를 셋 넘게 잇거나("추천 API 캐시 미적용 지연"), 사람들이 보통 쓰지 않는 단어 조합을 쓰거나, 독자가 대상을 찾을 수 없는 지시어를 쓴다.
      (3) 빈 문장·묻힌 요점: 주절이 "공유드립니다", "참고 부탁드립니다", "확인되었습니다"처럼 비어 있고 요점이 명사절이나 앞 절에 묻혀 있거나, 읽고 나서 남는 내용이 없다.
      PASS: 결함이 하나라도 있는 문장이 전체 문장의 20% 이하다(문장이 10개 미만이면 1개 이하).
      FAIL: 결함이 있는 문장이 그보다 많다. 판정 이유에 결함 문장과 라벨을 적는다.
  # 근거: skills/productivity/write-docs/SKILL.md:41
  # 근거: skills/productivity/write-docs/reference/clear-writing.md:41
  - name: conclusion-first
    type: llm
    criteria: |
      PASS: 보고 본문의 첫 문장("*추천 위젯 A/B 실험 결과*"나 "#growth 채널용 초안" 같은 제목·머리글 한 줄과 인사말 한 마디는 빼고)이 실험의 결론, 곧 B안(개인화 추천 위젯)을 전체에 적용하지 않고 보류한다는 결정이나 클릭률은 올랐지만 전환율 차이는 확인되지 않았다는 결과를 말한다. 다음 할 일(민지 님의 캐시 적용 후 2주 재실험)과 데이터팀에 바라는 일(재실험 전에 전환 윈도 7일·14일 중 지표 정의 검토)이 본문에 행동으로 나온다.
      FAIL: 실험 기간·대상 같은 배경이나 "실험 결과 공유드립니다"처럼 내용 없는 문장으로 시작해 결론이 첫 문장에 없거나, 데이터팀에 무엇을 해 달라는지 빠진다.
  # 근거: skills/productivity/write-docs/SKILL.md:48
  # 근거: skills/productivity/write-docs/SKILL.md:12
  # 근거: skills/productivity/write-docs/reference/clear-writing.md:43
  - name: facts-kept
    type: llm
    criteria: |
      PASS: 메모의 수치(군마다 약 12,000명, 클릭률 B 4.1%·A 3.2%, 전환율 B 2.3%·A 2.2%, p=0.41, p95 +180ms, 재실험 2주)를 바꾸지 않고, 로딩 지연 원인을 "추정"·"것으로 보인다"처럼 확정되지 않은 것으로 쓴다. 메모에 없는 사실(재실험 시작 날짜, 다른 담당자, 마감일, 캐시 적용 방법)을 더하지 않는다. 메모에 없는 값이 필요해 `[확인 필요: ...]`를 남긴 것은 더한 것으로 치지 않는다.
      FAIL: 수치를 하나라도 바꾸거나 빼서 결론을 다르게 만들거나, 로딩 지연 원인을 확정된 사실로 쓰거나, 메모에 없는 날짜·담당자·마감일·방법을 더한다.
