schema_version: "1.1"
name: numbered-ask-no-tool
description: 선택지 질문 도구가 없는 환경에서 빠진 독자·톤을 번호 목록으로 묻고, 기타(직접 입력)를 안내하며, 질문으로 턴을 끝내는지 (폴백 경로 점검)
tags: [ask, fallback]
execution:
  # 독자와 톤을 일부러 뺐다. 자료는 메모에 모두 있어 [확인 필요] 질문은 나오지 않게 했다.
  # allowed_tools에 선택지 질문 도구를 넣지 않아 "없으면 번호 목록" 폴백만 남는다.
  prompt: |
    /write-docs notes/rollback-memo.md 메모로 배포 롤백 절차 문서 초안 써줘.
    - 분야: 기술 문서, 유형은 문제 해결
    - 목적: 배포가 실패했을 때 메모만 보고 바로 롤백하게 한다
    - 자료: 메모 파일이 전부야
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/productivity/write-docs/SKILL.md:33
  # 근거: skills/productivity/write-docs/SKILL.md:35
  - name: numbered-list-question
    type: llm
    criteria: |
      PASS: 비어 있는 독자와 톤을 묻고, 질문을 번호 목록 텍스트로 쓰며 각 질문에 고를 수 있는 선택지를 단다. 이미 요청에 있는 분야·유형·목적·자료는 다시 묻지 않는다.
      FAIL: 독자나 톤을 묻지 않고 스스로 정해 초안을 쓰거나, 번호 없는 문단 속에 질문을 섞거나, 선택지 없이 자유 서술로만 묻는다.
  # 근거: skills/productivity/write-docs/SKILL.md:35
  - name: free-input-option
    type: llm
    criteria: |
      PASS: 선택지에 없는 답을 기타(직접 입력)나 그에 준하는 방식으로 적어도 된다고 안내한다.
      FAIL: 제시한 선택지 중에서만 고르게 하고, 선택지 밖 답을 받는다는 안내가 없다.
  # 근거: skills/productivity/write-docs/SKILL.md:35
  # 근거: skills/productivity/write-docs/SKILL.md:36
  - name: question-is-last
    type: llm
    criteria: |
      PASS: 질문이 이 턴의 마지막 메시지이고, 질문 뒤에 도구 호출이나 초안 작성을 이어 가지 않는다.
      FAIL: 질문을 보낸 뒤 같은 턴에서 도구를 호출하거나 초안을 쓰거나, 질문을 도구 호출 사이 메시지에 끼워 넣는다.
  # 근거: skills/productivity/write-docs/SKILL.md:35
  - name: no-missing-tool
    type: llm
    criteria: |
      PASS: 쓸 수 없는 질문 도구(선택창, AskUserQuestion 등)를 부르겠다거나 선택창을 띄웠다고 말하지 않고, 번호 목록으로 바로 묻는다.
      FAIL: 선택창이나 질문 도구를 띄우겠다/띄웠다고 말하거나, 도구가 없어 물을 수 없다며 질문 없이 멈춘다.
