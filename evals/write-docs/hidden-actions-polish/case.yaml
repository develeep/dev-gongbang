schema_version: "1.1"
name: hidden-actions-polish
description: 개발자식 명사 표현과 지어낸 단어 조합으로 행동을 숨긴 PR 설명 초안을 수정 범위 "문장만"으로 다듬을 때, 누가 무엇을 하는지 드러내고 섹션과 사실을 지키는지
tags: [polish, work-message]
execution:
  # 고칠 곳을 프롬프트에 알려 주지 않는다. "이루어졌습니다" 같은 뻔한 표현은 스킬 없이도 고쳐져서(Δ 0),
  # Claude Code 보고에 흔한 개발자식 표현으로 썼다. 용어 뜻까지 자료 줄에 주면 스킬 없이도 고쳐져서(Δ 0) 행위자만 준다.
  # "정합성 이슈", "복원 트리거"의 뜻은 제목("주문 취소 시 재고 복구")과 리뷰 요청의 "복구 요청"에서 읽어 낼 수 있다.
  prompt: |
    /write-docs docs/pr-draft.md PR 설명 초안 다듬어줘.
    - 분야: 업무 메시지
    - 독자: 이 PR을 리뷰할 백엔드 팀원
    - 목적: 무엇을 고쳤고 무엇을 확인했는지 알리고 재시도 로직에 대한 의견을 받는다
    - 톤: 지금 초안 그대로(합니다체)
    - 자료: 초안에 있는 사실이 전부다. 이 PR은 내가 썼고 로컬 확인도 내가 했다. 취소 이벤트를 받는 쪽은 주문 서비스고, 재고를 되돌리는 쪽은 재고 서비스다.
    - 수정 범위: 문장만
    결과는 채팅으로 보여 줘.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/productivity/write-docs/SKILL.md:55
  # 근거: skills/productivity/write-docs/SKILL.md:90
  # 근거: skills/productivity/write-docs/reference/clear-writing.md:25
  - name: unclear-sentence-ratio
    type: llm
    criteria: |
      결과의 PR 설명 본문(제목과 본문 밖의 설명·확인 요청은 빼고)을 문장 단위로 나눈다. 각 문장에 다음 결함이 있는지 붙인다.
      (1) 행동 숨김: 행동이 "확인 완료", "미검증 상태", "도입 여부", "트리거가 걸리도록"처럼 동사에서 나온 명사나 피동으로 나와 누가(작성자, 주문 서비스, 리뷰어) 무엇을 하는지 문장에서 알 수 없다.
      (2) 모호하거나 지어낸 말: "재고 정합성 이슈", "재고 복원 트리거", "취소 경로"처럼 독자가 실제로 무슨 일이 일어나는지 풀어 읽어야 하는 말을 그대로 두거나, 명사를 셋 넘게 잇거나, 대상을 찾을 수 없는 지시어를 쓴다.
      (3) 빈 문장·묻힌 요점: 요점이 "~ 여부는", "~에 대해서는" 같은 명사구에 묻히고 주절이 "논의가 필요한 부분입니다", "있으면 좋겠습니다"처럼 비어 있어 리뷰어에게 무엇을 바라는지 바로 보이지 않거나, 읽고 나서 남는 내용이 없다.
      PASS: 결함이 하나라도 있는 문장이 1개 이하다.
      FAIL: 결함이 있는 문장이 2개 이상이다. 판정 이유에 결함 문장과 라벨을 적는다.
  # 근거: skills/productivity/write-docs/SKILL.md:49
  # 근거: skills/productivity/write-docs/SKILL.md:12
  - name: facts-and-structure-kept
    type: llm
    criteria: |
      PASS: 제목과 섹션("주문 취소 시 재고 복구", "변경 사항", "테스트", "리뷰 요청")이 같은 순서와 문구로 남는다. 원본과 자료의 사실(주문 취소 때의 재고 문제, 곧 초안의 "재고 정합성 이슈"를 고침. 증상을 "재고가 돌아오지 않던 문제"처럼 풀어 쓰든 "재고가 복구되도록 고쳤다"처럼 쓰든 같은 사실로 본다, 주문 서비스가 취소 이벤트를 받으면 재고 서비스에 복구를 요청함, 취소 뒤 재고 수량이 돌아오는지 로컬에서만 확인함, 부분 취소는 확인하지 않음, 복구 요청이 실패할 때 재시도 로직을 넣을지 의견을 구함)이 그대로 있다. 원본에 없는 사실(테스트 코드, 스테이징 확인, 재시도 횟수, 원인 설명)을 더하지 않는다. 용어의 뜻을 확신하지 못해 `[확인 필요: ...]`로 남기거나 묻는 것은 사실을 뺀 것으로 치지 않는다.
      FAIL: 섹션 순서나 제목을 바꾸거나, 위 사실 중 하나라도 빠지거나 바뀌거나(예: 부분 취소도 확인했다고 씀), 원본에 없는 사실을 더한다.
