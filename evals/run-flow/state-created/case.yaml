schema_version: "1.1"
name: state-created
description: 요청 문장으로 시작하면 0단계에서 docs/context/run-flow/에 2단계를 가리키는 상태 파일을 만들고, brief로 오인될 `- 작성일:` 줄을 쓰지 않는지
tags: [state-file, request]
execution:
  prompt: /run-flow 주문이 배송 시작되면 고객에게 이메일 알림을 보내줘
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/run-flow/SKILL.md:29, skills/in-progress/run-flow/SKILL.md:31-32
  # 근거: skills/in-progress/run-flow/assets/state-file.md
  - name: state-file-created
    type: llm
    criteria: |
      PASS: docs/context/run-flow/ 아래에 `YYYY-MM-DD-<영문 소문자·하이픈 slug>.md` 파일이 하나 있고, `- 시작일:` 줄, 2단계(구체화)를 가리키는 `- 현재 단계:` 줄, `- 멈춘 이유:` 줄, 0~7단계 목록이 있는 `## 단계`, `## 결과물` 섹션이 있다.
      FAIL: 상태 파일이 없거나, 다른 위치에 있거나, 위 줄·섹션 중 하나라도 없거나, 현재 단계가 2단계가 아니다.
  # 근거: skills/in-progress/run-flow/SKILL.md:21
  - name: no-written-date-line
    type: llm
    criteria: |
      PASS: 상태 파일에 `- 작성일:`로 시작하는 줄이 없다.
      FAIL: 상태 파일에 `- 작성일:` 줄이 있거나 상태 파일이 없다.
  # 근거: skills/in-progress/run-flow/SKILL.md:78, skills/in-progress/run-flow/SKILL.md:99
  - name: framing-problems-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 1
