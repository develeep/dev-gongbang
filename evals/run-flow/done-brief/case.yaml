schema_version: "1.1"
name: done-brief
description: 티켓이 모두 끝난 brief 경로를 받으면 기획서로 오인하지 않고 6단계부터 시작해, 티켓 완료 기록과 git log로 결과를 모아 보여 주고 push·PR 없이 선택을 묻는지
tags: [start-stage, resume, merge-decision]
execution:
  prompt: /run-flow docs/context/2026-10-22-greeting.md
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/run-flow/SKILL.md:37
  # 근거: skills/in-progress/run-flow/SKILL.md:46
  - name: no-stage-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:analyzing-requirements|framing-problems|set-brief|set-ticket|run-ticket)"'
    min: 0
    max: 0
  # 근거: skills/in-progress/run-flow/SKILL.md:82
  - name: report-from-records
    type: llm
    criteria: |
      PASS: 티켓 01·02가 끝났다는 것과 각 티켓의 완료 기준 결과를 티켓의 `## 완료 기록`·완료 기준에서 가져와 보여 주고, 두 기능 커밋(인사말 대문자 변환, 느낌표 추가)이나 바뀐 파일 `src/greet.py`를 git 기록에서 가져와 보여 준다.
      FAIL: 티켓별 결과나 커밋·바뀐 파일 중 하나가 빠지거나, 보고할 근거가 없다며 멈추거나, 티켓을 다시 구현한다.
  # 근거: skills/in-progress/run-flow/SKILL.md:82-86
  - name: asks-three-choices
    type: llm
    criteria: |
      PASS: PR 만들기, 고치기, 멈추기 세 가지를 보여 주고 사용자가 고르게 한다.
      FAIL: 셋 중 하나를 스스로 골라 진행하거나, 선택지를 보여 주지 않는다.
  # 근거: skills/in-progress/run-flow/SKILL.md:17
  - name: no-push-or-pr
    type: tool_used
    tool: Bash
    input_match: 'git\s+push|gh\s+pr\s+create'
    min: 0
    max: 0
