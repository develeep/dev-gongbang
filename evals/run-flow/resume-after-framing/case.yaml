schema_version: "1.1"
name: resume-after-framing
description: 구체화 기록까지 적혔지만 brief가 없는 상태 파일만 있는 레포에서 인자 없이 실행하면 3단계부터 이어 가며 그 기록을 set-brief에 넘기는지
tags: [state-file, resume]
execution:
  prompt: |
    /run-flow

    저장 위치를 물으면 "docs/context/ 문서로 저장"이라고 답한다.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/run-flow/SKILL.md:118, skills/in-progress/run-flow/SKILL.md:121
  - name: set-brief-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-brief"'
    min: 1
  # 근거: skills/in-progress/run-flow/SKILL.md:121
  - name: earlier-stages-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:analyzing-requirements|framing-problems)"'
    min: 0
    max: 0
  # 근거: skills/in-progress/run-flow/SKILL.md:121
  - name: framing-record-reused
    type: llm
    criteria: |
      PASS: set-brief에 넘긴 내용이나 brief 초안이 상태 파일 `## 구체화 기록`의 최종 목적(`shipped`로 바뀌면 이메일 한 번)과 해법(`send_email` 호출)을 그대로 쓰고, 구체화 질문을 다시 하지 않는다.
      FAIL: 구체화 기록을 쓰지 않고 요청을 다시 묻거나, 기록과 다른 목적·해법으로 brief를 쓴다.
  # 근거: skills/in-progress/run-flow/SKILL.md:24
  - name: state-advanced
    type: llm
    criteria: |
      PASS: 상태 파일의 `- 현재 단계:`가 3단계(작업 지시서)로 바뀌었다.
      FAIL: 상태 파일의 현재 단계가 그대로 2단계이거나 상태 파일을 새로 만들었다.
