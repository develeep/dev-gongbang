schema_version: "1.1"
name: symlink-state
description: 상태 파일과 brief가 심볼릭 링크로 붙인 .scratch 폴더 안에 있을 때 인자 없이 실행하면 그 상태 파일을 찾아 5단계부터 이어 가는지
tags: [start-stage, resume, state-file]
execution:
  prompt: /run-flow
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/run-flow/SKILL.md:81, skills/in-progress/run-flow/SKILL.md:87
  - name: finds-linked-state-file
    type: llm
    criteria: |
      PASS: `.scratch/greeting/run-flow/2026-10-22-greeting.md` 상태 파일을 찾아, 그 파일의 현재 단계인 5단계(구현과 리뷰)부터 이어 간다고 알리거나 이어 간다.
      FAIL: 진행 중인 흐름이나 brief가 없다고 하거나, 무엇을 진행할지 묻거나, 다른 단계부터 시작한다.
  # 근거: skills/in-progress/run-flow/SKILL.md:31
  - name: no-new-state-file
    type: llm
    criteria: |
      PASS: `docs/context/run-flow/` 등에 새 상태 파일을 만들지 않고, 고친다면 `.scratch/greeting/run-flow/2026-10-22-greeting.md`를 고친다.
      FAIL: 새 상태 파일을 만든다.
  # 근거: skills/in-progress/run-flow/SKILL.md:81
  - name: earlier-stages-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:analyzing-requirements|framing-problems|set-brief|set-ticket)"'
    min: 0
    max: 0
