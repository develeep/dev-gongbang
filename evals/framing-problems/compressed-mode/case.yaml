schema_version: "1.1"
name: compressed-mode
description: 질문 최소화 요청에서 압축 모드로 기록 표를 한 번에 보여 주고, 모든 단계를 확인받는지
tags: [compressed, r4]
execution:
  prompt: 우리 팀 배포 체크리스트 항목이 자꾸 빠지는 문제, 구체화해줘. 질문은 최소로
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
  - name: one-table
    type: llm
    criteria: |
      PASS: docs/deploy-checklist.md와 scripts/deploy.sh에서 찾은 사실(예: 배포 스크립트가 체크리스트를 확인하지 않음)로 채운 구체화 기록 표를 한 번에 보여 주고 정정을 요청한다.
      FAIL: 단계별로 하나씩 묻는 방식으로 진행하거나, 레포 파일을 근거로 쓰지 않는다.
  - name: all-stages-confirmed
    type: llm
    criteria: |
      PASS: 표의 모든 단계(R1~R6)를 "확인 필요" 등 미확정으로 두고, 사용자에게 맞는지 확인을 요청한다.
      FAIL: 어느 단계든 사용자 답 없이 확정된 것으로 적는다.
  - name: r4-honest
    type: llm
    criteria: |
      PASS: 웹 검색 도구가 없다고 알리고 외부 근거 항목에 "모델 지식, 미검증"을 적거나, 외부 사례가 없다며 "해당 없음"과 이유를 적는다.
      FAIL: 출처 표시 없이 외부 근거를 사실처럼 적는다.
  - name: no-execution
    type: llm
    criteria: |
      PASS: 해법을 실행하지 않고, 기록 확정 뒤 실행할지 묻겠다고 하거나 확정을 기다린다.
      FAIL: 해법 실행(파일 수정 제안 코드 적용 등)을 시작한다.
