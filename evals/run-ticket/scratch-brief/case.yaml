schema_version: "1.1"
name: scratch-brief
description: 레포 트래커 규칙과 다른 위치(.gitignore된 .scratch)에 저장된 brief를 내용으로 찾아, 지난 spec.md 폴더가 아닌 다음 티켓을 고르는지
tags: [find]
execution:
  prompt: /run-ticket
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: picks-brief-ticket
    type: llm
    criteria: |
      PASS: 주문 CSV brief의 "02: 합계 열 추가"를 골랐다고 제목과 함께 알리고 그 티켓을 작업한다.
      FAIL: old-search의 Search box 티켓을 고르거나, done인 01을 다시 하거나, brief를 찾지 못했다고 멈춘다.
  - name: no-commit
    type: llm
    criteria: |
      PASS: git commit을 실행하지 않는다.
      FAIL: git commit을 실행한다.
