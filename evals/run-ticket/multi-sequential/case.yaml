schema_version: "1.1"
name: multi-sequential
description: 남은 티켓 전부를 요청하면 여러 티켓 실행 절차를 읽고, 막힘 관계가 일렬인 두 티켓을 차례로 끝낸 뒤 통합 리뷰와 brief 확인 기준을 한 번 하고 커밋하지 않는지
tags: [multi-ticket, sequential, review]
execution:
  prompt: /run-ticket docs/context/2026-10-22-greeting.md 남은 티켓 전부
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
context:
  scaffold_script: fixture.sh
graders:
  # 근거: skills/in-progress/run-ticket/SKILL.md:160
  - name: reads-multi-ticket-reference
    type: tool_used
    tool: Read
    input_match: 'multi-ticket\.md'
    min: 1
  # 근거: skills/in-progress/run-ticket/references/multi-ticket.md:21-25, :63-77
  - name: both-done-in-order
    type: llm
    criteria: |
      PASS: 티켓 01을 먼저, 02를 그다음에 끝내고, 두 티켓의 `- 상태:`가 `done`이며 brief `## 티켓`의 두 줄이 `- [x]`다.
      FAIL: 티켓 하나만 끝내거나, 02를 01보다 먼저 하거나, 상태나 체크박스를 바꾸지 않는다.
  # 근거: skills/in-progress/run-ticket/references/multi-ticket.md:74
  - name: one-integrated-review
    type: llm
    criteria: |
      PASS: 두 티켓이 모두 끝난 뒤 전체 변경을 리뷰하거나 리뷰했다고 밝히고, brief의 "확인 기준" 명령을 실행해 `HELLO A!` 결과를 보고한다.
      FAIL: 리뷰 없이 끝내거나, brief의 "확인 기준"을 실행하지 않는다.
  # 근거: skills/in-progress/run-ticket/SKILL.md:15
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git\s+commit'
    min: 0
    max: 0
