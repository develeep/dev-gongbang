schema_version: "1.1"
name: gpt6-astra-agent
description: "GPT-6 Astra 대상 요청에서 gpt-6-astra 가이드를 쓰고 Claude 전용 구조·설정을 넣지 않는지"
tags: [model, gpt]
execution:
  prompt: |
    /prompt-builder GPT-6 Astra(gpt-6-astra)로 돌릴 코딩 에이전트 프롬프트 만들어줘. Responses API로 돌릴 거야.
    프롬프트 언어는 영어, 빠른 모드. 인터뷰 답:
    - 목적: 사내 결제 서비스의 버그 수정 PR 작성. 성공 = 테스트 통과하는 PR
    - 역할: 백엔드 엔지니어
    - 배경: TypeScript 모노레포, pnpm
    - 도구: shell, apply_patch
    - 실행 방식: 사람이 대화하며 진행. 기본 성향: 적극 실행
    - 확인 필요 행동: git push, 프로덕션 DB 접근
    - 완료 조건: pnpm test 통과
    - 작업 영역: 코딩. 코딩 세부: 테스트 통과가 완료 조건에 포함
    - 실행 시 구체화(C16): 아니오
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-gpt6-astra-guide
    type: tool_used
    arm: both
    tool: Read
    input_match: 'gpt-6-astra\.md'
  - name: no-claude-only-settings
    type: llm
    criteria: |
      PASS: 실행 설정 권고(나왔다면)가 reasoning effort(low~max 중 하나, none 아님)와 text.verbosity 같은 OpenAI 파라미터를 쓰고, Claude 전용 설정(thinking, output_config.effort, budget_tokens, prefill, 베타 헤더)을 권하지 않는다. 설정 권고까지 가지 못했어도 Claude 전용 설정을 언급하지 않으면 PASS다.
      FAIL: Claude 전용 설정을 권하거나, effort none을 권하거나, temperature·top_p를 권한다.
  - name: no-xml-skeleton
    type: llm
    criteria: |
      PASS: 완성 프롬프트(나왔다면)가 Claude용 XML 태그 골격(<context>, <instructions>, <constraints> 등) 대신 이름 붙은 절(Role, Goal, Success criteria, Constraints 등) 구조를 쓴다. 프롬프트까지 가지 못했으면 구조를 XML로 안내하지 않는 한 PASS다.
      FAIL: GPT 대상인데 Claude용 XML 태그 골격으로 조립하거나 그렇게 하겠다고 안내한다.
