schema_version: "1.1"
name: mixed-question-split
description: "상세 인터뷰에서 서술형과 선택형이 함께 있는 라운드를 AskUserQuestion과 한 메시지에 섞지 않고 나눠 묻는지"
tags: [answers, ask-user-question]
execution:
  prompt: |
    /prompt-builder 개발자와 대화하며 PR 리뷰 코멘트 초안을 만드는 에이전트 프롬프트 만들어줘. 지금까지 받은 답은 아래와 같아.
    - 종류: 에이전트/하네스 프롬프트. 대상 모델은 세션 모델, 프롬프트 언어는 한국어, 진행 방식은 상세 인터뷰
    - 목적: PR diff를 읽고 버그와 보안 문제를 찾아 리뷰 코멘트 초안을 만든다. 성공 = 리뷰어가 고치지 않고 남길 수 있는 코멘트 목록
    - 사용자: 사내 백엔드 개발자, 중급 이상
    - 역할: 시니어 백엔드 리뷰어
    - 배경: Python/Django 모노레포. 사내 스타일 가이드는 docs/style.md에 있다
    - 도구: Read/Grep(코드 읽기), Bash(테스트 실행), gh CLI(PR diff 조회)
    - 실행 방식: 사람이 대화하며 진행. 기본 성향: 신중하게 제안 위주. 진행 보고: 기본값. 작업 영역: 코딩
    여기까지가 1·2라운드 답이야. 다음 라운드부터는 라운드별로 물어봐 줘.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
graders:
  # 근거: skills/productivity/prompt-builder/SKILL.md:24
  # 근거: skills/productivity/prompt-builder/reference/interview.md:105
  - name: no-mixed-message
    type: llm
    criteria: |
      PASS: AskUserQuestion을 호출한 어떤 응답에도(그 호출과 같은 응답에 쓴 텍스트 포함) 번호를 붙인 서술형 질문이나 승인을 기다리는 표·제안이 함께 있지 않다. AskUserQuestion을 한 번도 호출하지 않고 질문을 모두 텍스트로 물어도 PASS다.
      FAIL: AskUserQuestion 호출과 같은 응답에 서술형 질문(확인 필요 행동, 완료 조건, 규칙 등)이나 승인받을 표·제안이 함께 있다.
  # 근거: skills/productivity/prompt-builder/SKILL.md:92
  # 근거: skills/productivity/prompt-builder/reference/interview.md:119
  - name: round3-text-questions
    type: llm
    criteria: |
      PASS: 받은 답을 되짚은 뒤 3라운드의 서술형 항목(확인 필요 행동 G4, 완료 조건 G5, 규칙 C7, 범위 밖 요청 C8, 성공 검증 C14)을 번호 텍스트 질문으로 한 메시지에 모아 묻는다. 같은 라운드의 선택형(실행 시 구체화 C16)은 서술형 답을 받은 뒤로 미루거나 같은 텍스트 안에 (a)(b) 선택지로 묻는다.
      FAIL: 3라운드 서술형 항목을 묻지 않거나, 하나씩 따로 묻거나, 사용자 답 없이 채워 넣는다.
