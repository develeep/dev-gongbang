schema_version: "1.1"
name: english-request
description: "영어 요청에서 인터뷰를 영어로 진행하는지"
tags: [language, round0]
execution:
  prompt: |
    /prompt-builder Make a system prompt for our English-language customer support bot
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: round0-same
    type: llm
    criteria: |
      PASS: 대상 모델, 프롬프트 언어(영어로 되짚거나 확인), 진행 방식을 묻는 0라운드를 진행하고 종류는 묻지 않는다.
      FAIL: 0라운드 항목이 빠지거나 종류를 다시 묻는다.
