schema_version: "1.1"
name: bugfix-template-framing
description: "C16이 요청에 분명할 때 framing-problems 호출 지시를 넣는지"
tags: [framing, full]
execution:
  prompt: |
    /prompt-builder 버그 수정 요청이 올 때마다 쓸 단발 작업 프롬프트 템플릿 만들어줘. 실행하면 바로 고치지 말고 문제부터 구체화하게 해줘. 답은 아래와 같아.
    - 목적: 들어온 버그 리포트를 원인부터 짚고 고친다. 성공 = 재현 테스트가 추가되고 통과
    - 독자: 리포트를 올린 개발자
    - 배경: TypeScript 웹 앱, 테스트는 vitest
    - 자료: 버그 리포트 한 건
    - 재사용: 변수를 바꿔 가며 쓰는 템플릿
    - 산출물: 코드
    대상 모델은 세션 모델, 프롬프트 언어는 한국어, 빠른 모드로 하고, 기본값 표는 모두 승인한다. 모델 특화 결정 질문은 모두 '추가하지 않음 / 아니오'로 답한다. 더 묻지 말고 바로 최종 결과를 내줘.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: framing-instruction
    type: llm
    criteria: |
      PASS: 완성 프롬프트의 작업 지시보다 앞에 framing-problems 호출 지시가 있고, 네 가지(프롬프트 내용은 확인된 사실로 씀, 적힌 해법은 보류, 확정된 기록의 R5에 따라 작업, 정정 시 되돌아가기)를 모두 담는다.
      FAIL: 호출 지시가 없거나 작업 지시 뒤에 있거나 네 가지 중 하나라도 빠졌다.
  - name: framing-not-run
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 0
    max: 0
