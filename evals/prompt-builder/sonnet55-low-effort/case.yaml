schema_version: "1.1"
name: sonnet55-low-effort
description: "Sonnet 5.5 요청에서 sonnet-5-5 가이드를 고르고 low effort 관련 결정을 묻는지"
tags: [model]
execution:
  prompt: |
    /prompt-builder Sonnet 5.5로 돌릴 코딩 에이전트 프롬프트 만들어줘. 비용 때문에 effort는 low로 쓸 거야.
    프롬프트 언어는 한국어, 빠른 모드. 인터뷰 답:
    - 목적: 사내 API 서버의 버그 수정 PR 작성. 성공 = 테스트 통과하는 PR
    - 역할: 백엔드 엔지니어
    - 배경: Go 1.22 모노레포
    - 도구: Bash, Read, Edit
    - 실행 방식: 사람이 대화하며 진행. 기본 성향: 신중
    - 확인 필요 행동: git push
    - 완료 조건: go test ./... 통과
    - 작업 영역: 코딩. 코딩 세부: 테스트 통과가 완료 조건에 포함
    - 실행 시 구체화(C16): 아니오
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-sonnet55-guide
    type: tool_used
    arm: both
    tool: Read
    input_match: 'sonnet-5-5\.md'
  - name: not-sonnet5-guide
    type: tool_used
    arm: both
    tool: Read
    input_match: 'sonnet-5\.md'
    min: 0
    max: 0
