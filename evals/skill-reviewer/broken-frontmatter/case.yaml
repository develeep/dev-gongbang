schema_version: "1.1"
name: broken-frontmatter
description: YAML이 깨진 스킬을 오류로 잡고 그 원인과 영향을 설명하는지
tags: [frontmatter]
execution:
  prompt: /skill-reviewer skills/engineering/broken
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: e2-reported
    type: llm
    criteria: |
      PASS: broken 스킬의 frontmatter YAML 파싱 실패(E2)를 오류로 보고하고, Claude Code가 이 경우 필드 없이 로드해 description이 사라진다는 영향을 설명한다.
      FAIL: 파싱 실패를 놓치거나, 스킬이 정상이라고 하거나, 영향을 설명하지 않는다.
  - name: no-guess-on-description
    type: llm
    criteria: |
      PASS: description 관련 판단 항목(L1~L3)을 판정 불가로 두거나 판정하지 않는다.
      FAIL: 깨진 description을 읽은 것처럼 L1~L3을 통과나 미흡으로 판정한다.
  - name: concrete-fix
    type: llm
    criteria: |
      PASS: 수정 계획에 `[닫히지 않은 괄호`를 따옴표로 감싸는 등 YAML이 파싱되도록 고치는 구체적인 방법이 있다.
      FAIL: "YAML을 고친다" 수준의 일반적인 말만 있다.
