schema_version: "1.1"
name: latest-brief
description: 인자 없이 실행하면 가장 최근 brief를 골라 확인 없이 진행하고 고른 brief를 알리는지
tags: [input]
execution:
  prompt: /set-ticket
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: picks-latest
    type: llm
    criteria: |
      PASS: 2026-10-15 로그인 잠금 brief를 골랐다고 알리고, 분할안이 그 brief의 남은 일을 다룬다.
      FAIL: 이메일 인증 brief를 고르거나, 어떤 brief를 골랐는지 알리지 않는다.
  - name: no-confirm-on-pick
    type: llm
    criteria: |
      PASS: brief를 고른 뒤 "이 brief로 진행할까요?" 같은 확인 없이 분할안까지 진행한다.
      FAIL: 분할안을 내기 전에 brief 선택을 확인받으려고 멈춘다.
