# ~/.omp/agent/config.yml에 병합할 항목의 예시. 값은 비워 두었다.
# 이 레포는 모델을 정하지 않는다. 모델은 사용자가 자기 환경에서 고른다. 고르는 방법은 docs/omp-orchestration.md에 있다.
# 값은 `<provider>/<모델 id>:<effort>` 형식으로 적는다. 채우지 않은 줄은 옮기지 않는다.

modelRoles:
  # 교차 리뷰 (code-reviewer가 `@review`로 쓴다). 구현하는 세션 모델과 다른 회사의 모델을 적는다. 비워 두면 code-reviewer가 세션 모델로 돌아 같은 회사 리뷰가 된다.
  # 비워 두면 run-ticket이 쓸 수 있는 모델을 조회해 다른 회사 모델을 고르고, 고르지 못하면 같은 회사 모델로 대체하고 완료 기록에 적는다.
  review:

  # 병렬 티켓 구현 워커 (선택). Orca 절차 등록 문구의 워커 모델 줄 `--model @worker`가 쓴다.
  # 비워 두면 워커 도구 절차의 규칙대로 고른다.
  worker:
