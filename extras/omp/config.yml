# ~/.omp/agent/config.yml에 병합할 항목
# 멀티에이전트 개발 단계별 모델·Effort (2026-11 기준). 설치 방법은 docs/omp-orchestration.md에 있다.
# GPT는 ChatGPT 구독(openai-codex) 기준이다. OpenAI API 키를 쓰면 `openai-codex/`를 `openai/`로 바꾼다.

modelRoles:
  # 메인 세션 = 오케스트레이터·설계, 계획 모드
  default: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high

  # brief 초안 (brief-writer). 문서 산출물은 high보다 xhigh에서 품질이 오른다.
  brief: anthropic/claude-opus-5-5:xhigh

  # 티켓 구현 워커. Orca는 extras/omp/AGENTS.md가 `--model @worker`로 띄운다. task와 같은 값으로 둔다.
  # Paseo는 extras/paseo/config.json의 ticket-worker 프로필로 띄운다.
  worker: anthropic/claude-opus-5-5:xhigh

  # 어려운 구현·대규모 리팩터링 (hard-implementer). task가 Opus xhigh라 승격 단계로 Fable을 쓴다.
  # Fable 5.2 high는 Opus 5.5 xhigh보다 FrontierCode-AA 2.0이 49.1% 대 43.8%다.
  slow: anthropic/claude-fable-5-2:high

  # 일반 구현·테스트, brief 냉독 읽기 (bundled task, implementer, test-writer, cold-reader)
  # Anthropic 한도가 넉넉하다고 보고 xhigh로 둔다. medium보다 FrontierCode-AA 2.0 33.1%→43.8%,
  # Terminal-Bench 4.0 52.5%→59.6%로 GPT-6.2 Sol medium(41.4%, 56.1%)도 넘는다. 느리면 high로 내린다.
  # Sonnet 5.5는 토큰을 더 써서 작업당 비용이 Opus 5.5와 비슷하고 점수는 max에서만 앞선다.
  task: anthropic/claude-opus-5-5:xhigh

  # 코드 탐색 (bundled scout, sonic), PR 설명 (doc-writer), 세션 제목 등 가벼운 작업
  smol: anthropic/claude-haiku-5-5:medium
  tiny: anthropic/claude-haiku-5-5:low

  # 커밋 메시지
  commit: anthropic/claude-haiku-5-5:medium

  # UI·화면 검증 (ui-checker)
  vision: openai-codex/gpt-6.1-terra:medium

  # 교차 리뷰와 리뷰 스킬 (사용자 정의 역할, bundled reviewer와 code-reviewer가 쓴다)
  # 6.2 Astra 대신 Sol: FrontierCode 2.0에서 Astra와 0.5점 이내에 비용 약 1/5, openai-codex 컨텍스트도 500K로 Astra(272K)보다 크다.
  review: openai-codex/gpt-6.2-sol:high

  # 막혔을 때 자문 (hard-implementer에만 붙인다). 본 모델(Fable)과 다른 시각을 주도록 Opus를 쓴다.
  advisor: anthropic/claude-opus-5-5:xhigh

# advisor는 붙은 세션의 모든 턴을 읽는다. 메인 세션에서는 끄고 hard-implementer 파일의 `advisor: true`로만 켠다.
advisor:
  enabled: false

task:
  agentModelOverrides:
    # bundled reviewer를 다른 회사 모델(GPT-6.2 Sol) 교차 리뷰로 바꾼다.
    reviewer: "@review"
    # bundled security-reviewer는 세션 모델을 따르므로 Opus high로 고정한다.
    security-reviewer: anthropic/claude-opus-5-5:high

retry:
  fallbackChains:
    # 모델을 쓸 수 없을 때(한도 초과 등) 남은 턴을 이어 갈 모델. 체인이 없는 역할도 이것을 쓴다.
    default:
      - openai-codex/gpt-6.2-sol:high
    # GPT를 쓸 수 없으면 리뷰와 화면 검증은 Opus로 넘긴다.
    review:
      - anthropic/claude-opus-5-5:high
    vision:
      - anthropic/claude-opus-5-5:medium
    # Fable 한도가 따로 잡혀 먼저 소진되면 어려운 구현은 Opus로 이어 간다.
    slow:
      - anthropic/claude-opus-5-5:xhigh
