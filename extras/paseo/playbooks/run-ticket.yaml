title: 티켓 실행
description: 티켓 하나를 구현하고, 다른 회사 모델이 리뷰한 뒤, 사람이 머지를 승인한다. 머지는 하지 않는다.

inputs:
  ticket:
    type: string
    required: true
    description: "티켓 경로, 이슈 번호나 URL"

outputs:
  branch: { type: string }
  commit: { type: string }

steps:
  - id: implement
    description: run-ticket 스킬의 2, 3, 4단계(맥락 읽기, 구현, 완료 기준 확인)를 수행하고 브랜치에 커밋한다.
    role:
      name: ticket-implementer
      prompt: |
        티켓: {{ inputs.ticket }}
        작업 위치: {{ worktree }}
    inputs: [ticket]
    outputs:
      base: { type: string, description: 작업을 시작할 때의 HEAD 해시 }
      branch: { type: string, description: 커밋한 브랜치 이름 }
      commit: { type: string, description: 커밋 해시 }
      report: { type: string, description: "완료 기준 결과, 바꾼 파일, 산출물" }
    retries: 1
    timeout: 2h

  - id: review
    description: 구현한 모델과 다른 회사 모델이 diff를 리뷰한다. 지적이 있으면 구현으로 되돌린다.
    role:
      name: ticket-reviewer
      prompt: |
        티켓: {{ inputs.ticket }}
        리뷰할 범위: {{ inputs.base }}..{{ inputs.commit }} (브랜치 {{ inputs.branch }})
        작업 위치: {{ worktree }}
    needs: [implement]
    inputs: [ticket, base, branch, commit]
    outputs:
      findings: { type: string, description: "지적 목록. 없으면 없음" }
    outcomes: [approved, changes_requested]
    on:
      changes_requested: { goto: implement, max_loops: 2 }

  - id: approve
    needs: [review]
    gate: { question: "티켓 브랜치를 머지해도 될까요? 머지는 승인한 뒤 직접 합니다." }
