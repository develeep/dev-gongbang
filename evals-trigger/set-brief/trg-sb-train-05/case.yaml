schema_version: "1.1"
name: trg-sb-train-05
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "주문 목록에 날짜 필터 추가해줘. src/orders 쪽이야"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-brief"'
    min: 0
    max: 0
