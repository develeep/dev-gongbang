schema_version: "1.1"
name: trg-sb-train-04
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "지금까지 나온 얘기 세 줄로 요약해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-brief"'
    min: 0
    max: 0
