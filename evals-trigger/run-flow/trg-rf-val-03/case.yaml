schema_version: "1.1"
name: trg-rf-val-03
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "이 작업 내용을 brief로만 남겨 줘. 구현은 나중에 할게"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-flow"'
    min: 0
    max: 0
