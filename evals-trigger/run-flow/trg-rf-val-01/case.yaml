schema_version: "1.1"
name: trg-rf-val-01
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "첨부한 기획서 PDF 보고 전체 개발을 맡아서 진행해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-flow"'
