schema_version: "1.1"
name: trg-rf-train-05
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "docs/context/2026-11-27-coupon/01-apply.md 티켓 하나만 실행해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
