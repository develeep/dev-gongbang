schema_version: "1.1"
name: trg-rf-train-02
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "회원 등급 기능을 요구사항 정리부터 티켓 나누고 구현, 리뷰까지 쭉 진행해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-flow"'
