schema_version: "1.1"
name: trg-rf-train-01
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "docs/spec/checkout.md 기획서대로 개발해서 PR까지 진행해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-flow"'
