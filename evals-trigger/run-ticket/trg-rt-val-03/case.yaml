schema_version: "1.1"
name: trg-rt-val-03
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "package.json의 lodash 버전을 올려줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-ticket"'
    min: 0
    max: 0
