schema_version: "1.1"
name: trg-rt-val-02
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "티켓 02, 03을 병렬로 돌려줘. 끝나면 brief 체크박스도 갱신해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
