schema_version: "1.1"
name: trg-rt-train-01
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "brief의 다음 티켓 실행해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-ticket"'
