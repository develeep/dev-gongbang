schema_version: "1.1"
name: trg-rt-train-05
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "이 함수 테스트 코드 짜줘. src/utils/date.py의 parse_range"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-ticket"'
    min: 0
    max: 0
