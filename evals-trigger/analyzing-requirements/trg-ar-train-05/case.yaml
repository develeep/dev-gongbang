schema_version: "1.1"
name: trg-ar-train-05
description: "트리거하면 안 됨 (새 PRD 작성) / train"
tags: [trigger, train, negative]
execution:
  prompt: "쿠폰 자동 발급 기능 PRD 처음부터 써줘. 아직 기획 문서는 없어"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:3
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-requirements"'
    min: 0
    max: 0
