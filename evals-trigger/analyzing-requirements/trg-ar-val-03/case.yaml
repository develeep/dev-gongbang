schema_version: "1.1"
name: trg-ar-val-03
description: "트리거하면 안 됨 (회의록 요약) / val"
tags: [trigger, val, negative]
execution:
  prompt: "오늘 기획 회의록 docs/meeting/2026-10-27.md 요약해서 결정 사항만 뽑아줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  # 근거: skills/in-progress/analyzing-requirements/SKILL.md:3
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-requirements"'
    min: 0
    max: 0
