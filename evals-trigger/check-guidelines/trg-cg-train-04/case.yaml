schema_version: "1.1"
name: trg-cg-train-04
description: "트리거하면 안 됨 (규칙 만들기는 set-guidelines) / train"
tags: [trigger, train, negative]
execution:
  prompt: "이 레포에 맞는 코딩 컨벤션 만들어줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  # 근거: skills/in-progress/check-guidelines/SKILL.md:3
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?check-guidelines"'
    min: 0
    max: 0
