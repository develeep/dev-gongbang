schema_version: "1.1"
name: trg-cg-train-05
description: "트리거하면 안 됨 (규칙 수정) / train"
tags: [trigger, train, negative]
execution:
  prompt: ".claude/rules/api.md에 응답 필드는 snake_case라는 규칙 추가해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  # 근거: skills/in-progress/check-guidelines/SKILL.md:3
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?check-guidelines"'
    min: 0
    max: 0
