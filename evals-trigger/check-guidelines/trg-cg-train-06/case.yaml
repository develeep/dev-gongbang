schema_version: "1.1"
name: trg-cg-train-06
description: "트리거하면 안 됨 (일반 코드 리뷰) / train"
tags: [trigger, train, negative]
execution:
  prompt: "orders.py에 버그 있는지 리뷰해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  # 근거: skills/in-progress/check-guidelines/SKILL.md:3
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?check-guidelines"'
    min: 0
    max: 0
