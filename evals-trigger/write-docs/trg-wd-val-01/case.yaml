schema_version: "1.1"
name: trg-wd-val-01
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "docs/architecture.md가 너무 읽기 어려워. 구조까지 다시 잡아서 고쳐 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write-docs"'
