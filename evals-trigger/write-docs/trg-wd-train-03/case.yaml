schema_version: "1.1"
name: trg-wd-train-03
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "결제 모듈 API를 처음 쓰는 개발자용 가이드 문서를 새로 써 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write-docs"'
