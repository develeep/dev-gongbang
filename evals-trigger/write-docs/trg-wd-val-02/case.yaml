schema_version: "1.1"
name: trg-wd-val-02
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "이번 PR 설명을 리뷰어가 바로 이해하게 써 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write-docs"'
