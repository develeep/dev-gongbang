schema_version: "1.1"
name: trg-wd-train-01
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "README.md 설치 절을 처음 쓰는 사람도 따라 할 수 있게 다듬어 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write-docs"'
