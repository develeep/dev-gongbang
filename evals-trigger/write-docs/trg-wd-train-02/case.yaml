schema_version: "1.1"
name: trg-wd-train-02
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "이번 주 작업 보고를 슬랙에 올릴 메시지로 써 줘. 배포 두 건이랑 장애 대응 한 건 했어"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write-docs"'
