schema_version: "1.1"
name: trg-fp-train-12
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "모노레포랑 멀티레포 장단점 일반론으로 설명해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 0
    max: 0
