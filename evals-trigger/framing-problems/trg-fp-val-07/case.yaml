schema_version: "1.1"
name: trg-fp-val-07
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "어제 장애 회고 문서 템플릿 하나 만들어줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 0
    max: 0
