schema_version: "1.1"
name: trg-fp-val-06
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "로그인 실패 버그 고쳐줘. 원인은 비밀번호 해시 비교할 때 인코딩이 안 맞는 거야. src/auth.py"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 0
    max: 0
