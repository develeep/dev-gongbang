schema_version: "1.1"
name: trg-fp-val-02
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "~/work/billing 서비스에서 월말마다 정산 배치가 타임아웃 나. 팀에서는 배치 서버 스펙을 올리자는데, 그 전에 문제부터 정리해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
