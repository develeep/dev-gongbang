schema_version: "1.1"
name: trg-fp-train-11
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "장바구니 쿠폰 적용 기능을 유저 스토리 3개로 쪼개줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
    min: 0
    max: 0
