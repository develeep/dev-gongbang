schema_version: "1.1"
name: trg-fp-val-01
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "이거 구체화 좀 해줘. 사내 위키 검색이 안 된다는 불만이 많아"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?framing-problems"'
