schema_version: "1.1"
name: trg-bs-val-03
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "지금 설치된 스킬 목록 보여 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
    min: 0
    max: 0
