schema_version: "1.1"
name: trg-bs-train-05
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "고객 상담 챗봇 시스템 프롬프트를 설계해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
    min: 0
    max: 0
