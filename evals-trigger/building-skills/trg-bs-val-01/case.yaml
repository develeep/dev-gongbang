schema_version: "1.1"
name: trg-bs-val-01
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "이 SKILL.md가 의도한 요청에서 잘 트리거되는지 테스트하고 description을 고쳐 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
