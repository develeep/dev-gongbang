schema_version: "1.1"
name: trg-bs-train-01
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "우리 배포 런북을 Claude 스킬로 만들어 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
