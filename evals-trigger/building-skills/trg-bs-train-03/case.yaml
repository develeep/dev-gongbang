schema_version: "1.1"
name: trg-bs-train-03
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "팀 코드 리뷰 절차를 스킬로 만들고 싶어. 대화 기록 줄 테니 거기서 뽑아 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
