schema_version: "1.1"
name: trg-bs-val-02
description: "트리거해야 함 / val"
tags: [trigger, val, positive]
execution:
  prompt: "prompt-builder가 만든 SKILL.md 초안을 이어받아서 스킬로 완성해 줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?building-skills"'
