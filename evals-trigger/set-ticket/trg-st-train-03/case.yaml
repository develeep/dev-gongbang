schema_version: "1.1"
name: trg-st-train-03
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "brief 이슈 #42를 티켓으로 분할해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
