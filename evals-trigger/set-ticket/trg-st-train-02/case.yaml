schema_version: "1.1"
name: trg-st-train-02
description: "트리거해야 함 / train"
tags: [trigger, train, positive]
execution:
  prompt: "방금 만든 brief가 너무 커. 작은 티켓으로 쪼개서 sub-issue로 남겨줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-ticket"'
