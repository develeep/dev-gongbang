schema_version: "1.1"
name: trg-st-val-03
description: "트리거하면 안 됨 (near-miss) / val"
tags: [trigger, val, negative]
execution:
  prompt: "프로젝트 TODO.md에 해야 할 일 다섯 개 추가해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-ticket"'
    min: 0
    max: 0
