schema_version: "1.1"
name: trg-st-train-05
description: "트리거하면 안 됨 (near-miss) / train"
tags: [trigger, train, negative]
execution:
  prompt: "결제 모듈 리팩터링을 단계별로 나눠서 계획만 알려줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?set-ticket"'
    min: 0
    max: 0
